<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <header class="app-header">
      <h1>Weather App</h1>
    </header>

    <main class="app">
      <section class="search" aria-label="Find a place">
        <label class="search__label" for="search-input"
          >Search for a city</label
        >
        <div class="search__combobox" id="combobox">
          <input
            id="search-input"
            class="search__input"
            type="text"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="search-results"
            autocomplete="off"
            spellcheck="false"
            placeholder="e.g. Colombo"
          />
          <ul
            id="search-results"
            class="search__results"
            role="listbox"
            aria-label="Matching places"
            hidden
          ></ul>
        </div>

        <fieldset class="unit-toggle" id="unit-toggle">
          <legend class="unit-toggle__legend">Units</legend>
          <label class="unit-toggle__option">
            <input
              id="unit-celsius"
              class="unit-toggle__input"
              type="radio"
              name="unit"
              value="celsius"
              checked
            />
            <span aria-hidden="true">°C</span>
            <span class="visually-hidden">Celsius</span>
          </label>
          <label class="unit-toggle__option">
            <input
              id="unit-fahrenheit"
              class="unit-toggle__input"
              type="radio"
              name="unit"
              value="fahrenheit"
            />
            <span aria-hidden="true">°F</span>
            <span class="visually-hidden">Fahrenheit</span>
          </label>
        </fieldset>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section
        id="current"
        class="current"
        aria-labelledby="current-heading"
        hidden
      ></section>

      <section
        id="forecast"
        class="forecast"
        aria-labelledby="forecast-heading"
        hidden
      >
        <h2 id="forecast-heading" class="forecast__heading">5-day forecast</h2>
        <ol id="forecast-list" class="forecast__list"></ol>
      </section>
    </main>

    <footer class="app-footer">
      <p>
        Weather data by
        <a href="https://open-meteo.com/" rel="noopener">Open-Meteo.com</a>
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
